services:
  backend:
    build:
      context: ../backend
    container_name: railgaadi-backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4000
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - railgaadi

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_MAPTILER_API_KEY: ${NEXT_PUBLIC_MAPTILER_API_KEY:-}
    container_name: railgaadi-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      API_URL: http://backend:4000/api/v1
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - railgaadi

  nginx:
    image: nginx:alpine
    container_name: railgaadi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - railgaadi

networks:
  railgaadi:
    driver: bridge
